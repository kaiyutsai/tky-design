<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>東山鴨頭 ERP 儀表板</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { color-scheme: light; }
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #f5f5f4; font-family: "Noto Sans TC", "Segoe UI", sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(180px); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useEffect, useMemo, useState } = React;

        const ChartIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-6m4 6V7m4 10v-3M4 19h16" />
            </svg>
        );

        const CartIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 4h2l2.4 10.2a1 1 0 00.98.8h8.84a1 1 0 00.98-.8L21 7H7" />
                <circle cx="10" cy="19" r="1.5" />
                <circle cx="18" cy="19" r="1.5" />
            </svg>
        );

        const BoxIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7l9-4 9 4-9 4-9-4z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 7v10l9 4 9-4V7" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 11v10" />
            </svg>
        );

        const ScanIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8V6a2 2 0 012-2h2M20 8V6a2 2 0 00-2-2h-2M4 16v2a2 2 0 002 2h2M20 16v2a2 2 0 01-2 2h-2" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h8" />
            </svg>
        );

        const StoreIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 10l1-5h14l1 5M5 10h14v10H5z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 14h6" />
            </svg>
        );

        const UserIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 12a4 4 0 100-8 4 4 0 000 8zm0 2c-4 0-7 2-7 4.5V20h14v-1.5C19 16 16 14 12 14z" />
            </svg>
        );

        const FireIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3c1 3 4 4 4 8a4 4 0 11-8 0c0-2 1-3.5 2.5-5" />
            </svg>
        );

        const ShieldIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3l7 3v5c0 5-3.5 8-7 10-3.5-2-7-5-7-10V6l7-3z" />
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.5 12.5l2 2 3-4" />
            </svg>
        );

        const TruckIcon = () => (
            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 6h11v9H3zM14 9h4l3 3v3h-7z" />
                <circle cx="7.5" cy="18" r="1.5" />
                <circle cx="18.5" cy="18" r="1.5" />
            </svg>
        );

        const DownloadIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v12m0 0l-4-4m4 4l4-4M5 20h14" />
            </svg>
        );

        const QrCodeIcon = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM16 14h2m-2 4h4m-4-2h2m2-2h0" />
            </svg>
        );

        const MockQRCode = () => (
            <div className="grid grid-cols-4 gap-1 bg-white p-1 rounded border border-stone-200">
                {[...Array(16)].map((_, index) => (
                    <div key={index} className={`w-3 h-3 ${index % 3 === 0 || index % 5 === 0 ? 'bg-stone-900' : 'bg-transparent'}`}></div>
                ))}
            </div>
        );

        const STORES = [
            { id: 'hq', name: '營運總部(管理員)', address: '台中市西屯區台灣大道 100 號' },
            { id: 'store-hc', name: '新竹師大', address: '新竹市東區大學路 18 號' },
            { id: 'store-ch-erlin', name: '彰化二林', address: '彰化縣二林鎮中正路 88 號' },
            { id: 'store-ch-pitou', name: '彰化埤頭', address: '彰化縣埤頭鄉斗苑西路 66 號' },
            { id: 'store-kh', name: '高雄師大', address: '高雄市苓雅區和平一路 116 號' }
        ];

        const CATALOG = [
            { id: 'P001', name: '東山鴨頭', category: '招牌主食', cost: 48, price: 85, barcode: '471000000001' },
            { id: 'P002', name: '甜不辣', category: '人氣單品', cost: 18, price: 35, barcode: '471000000002' },
            { id: 'P003', name: '米血', category: '人氣單品', cost: 16, price: 30, barcode: '471000000003' },
            { id: 'P004', name: '豆皮', category: '人氣單品', cost: 20, price: 40, barcode: '471000000004' },
            { id: 'P005', name: '鴨翅', category: '招牌主食', cost: 32, price: 60, barcode: '471000000005' }
        ];

        const pad = (value) => String(value).padStart(2, '0');
        const formatCurrency = (value) => `NT$ ${Number(value || 0).toLocaleString('zh-TW')}`;
        const formatDate = (date = new Date()) => `${date.getFullYear()}/${pad(date.getMonth() + 1)}/${pad(date.getDate())}`;
        const formatTime = (date = new Date()) => `${pad(date.getHours())}:${pad(date.getMinutes())}`;
        const addDays = (days, baseDate = new Date()) => {
            const next = new Date(baseDate);
            next.setDate(next.getDate() + days);
            return formatDate(next);
        };
        const parseDateString = (value) => {
            const [year, month, day] = value.split('/').map(Number);
            return new Date(year, month - 1, day);
        };
        const toYearMonth = (dateString) => dateString.slice(0, 7).replace('/', '-');
        const compareDateTimeDesc = (a, b) => new Date(`${b.date.replaceAll('/', '-')}T${b.time || '00:00'}:00`) - new Date(`${a.date.replaceAll('/', '-')}T${a.time || '00:00'}:00`);
        const sum = (records, field) => records.reduce((total, record) => total + Number(record[field] || 0), 0);
        const escapeHtml = (value) => String(value ?? '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');

        const downloadExcelReport = ({ filename, title, subtitleLines = [], headers, rows }) => {
            const tableRows = rows.map((row) => `
                <tr>
                    ${row.map((cell) => `<td style="border:1px solid #d6d3d1;padding:8px;white-space:nowrap;">${escapeHtml(cell)}</td>`).join('')}
                </tr>
            `).join('');

            const html = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                    <head>
                        <meta charset="UTF-8" />
                        <style>
                            body { font-family: "Microsoft JhengHei", Arial, sans-serif; padding: 20px; }
                            h1 { color: #1c1917; margin-bottom: 8px; }
                            p { color: #57534e; margin: 4px 0; }
                            table { border-collapse: collapse; margin-top: 16px; }
                            th { background: #292524; color: #ffffff; border: 1px solid #44403c; padding: 8px; }
                        </style>
                    </head>
                    <body>
                        <h1>${escapeHtml(title)}</h1>
                        ${subtitleLines.map((line) => `<p>${escapeHtml(line)}</p>`).join('')}
                        <table>
                            <thead>
                                <tr>${headers.map((header) => `<th>${escapeHtml(header)}</th>`).join('')}</tr>
                            </thead>
                            <tbody>${tableRows}</tbody>
                        </table>
                    </body>
                </html>
            `;

            const blob = new Blob(["\ufeff", html], { type: 'application/vnd.ms-excel;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename.endsWith('.xls') ? filename : `${filename}.xls`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 2000);
        };

        const TYPE_META = {
            sale: { label: '門市銷售', movement: 'out', color: 'bg-red-100 text-red-700 border-red-200' },
            shipment_in: { label: '門市進貨', movement: 'in', color: 'bg-blue-100 text-blue-700 border-blue-200' }
        };

        const createBatch = ({ store, qty, exp, receivedDate, source }) => ({
            id: `${store}-${Math.random().toString(36).slice(2, 8)}`,
            store,
            qty,
            exp,
            receivedDate,
            source
        });

        const createInventorySeed = () => CATALOG.map((item, index) => ({
            ...item,
            batches: [
                createBatch({ store: 'hq', qty: 260 - (index * 12), exp: addDays(18 + index), receivedDate: addDays(-5 - index), source: '中央備貨' }),
                createBatch({ store: 'store-hc', qty: 75 + (index * 7), exp: addDays(5 + index), receivedDate: addDays(-2), source: '總部配送' }),
                createBatch({ store: 'store-ch-erlin', qty: 68 + (index * 6), exp: addDays(6 + index), receivedDate: addDays(-3), source: '總部配送' }),
                createBatch({ store: 'store-ch-pitou', qty: 64 + (index * 5), exp: addDays(7 + index), receivedDate: addDays(-4), source: '總部配送' }),
                createBatch({ store: 'store-kh', qty: 58 + (index * 6), exp: addDays(8 + index), receivedDate: addDays(-1), source: '總部配送' })
            ]
        }));

        const buildLogRecord = ({ id, date, time, store, item, qty, type, note = '', counterpartyStore = '', expiryDate = '' }) => ({
            id,
            date,
            time,
            store,
            itemId: item.id,
            item: item.name,
            qty,
            type,
            movement: TYPE_META[type].movement,
            unitPrice: item.price,
            unitCost: item.cost,
            salesAmount: type === 'sale' ? item.price * qty : 0,
            costAmount: item.cost * qty,
            profit: type === 'sale' ? (item.price - item.cost) * qty : 0,
            note,
            counterpartyStore,
            expiryDate
        });

        const generateHistoricalLogs = () => {
            const logs = [];
            let nextId = 1;
            const monthOffsets = Array.from({ length: 14 }, (_, index) => 13 - index);

            monthOffsets.forEach((monthOffset) => {
                const monthDate = new Date(new Date().getFullYear(), new Date().getMonth() - monthOffset, 1);
                const daysInMonth = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0).getDate();

                STORES.filter((store) => store.id !== 'hq').forEach((store, storeIndex) => {
                    CATALOG.forEach((item, itemIndex) => {
                        [4, 11, 18, 25].forEach((day, slotIndex) => {
                            const actualDay = Math.min(day, daysInMonth);
                            const qty = 6 + (((monthOffset + 2) * 3) + (storeIndex * 4) + (itemIndex * 5) + (slotIndex * 2)) % 18;
                            const saleDate = formatDate(new Date(monthDate.getFullYear(), monthDate.getMonth(), actualDay));
                            logs.push(buildLogRecord({
                                id: nextId++,
                                date: saleDate,
                                time: `${pad(11 + slotIndex)}:${slotIndex % 2 === 0 ? '20' : '45'}`,
                                store: store.id,
                                item,
                                qty,
                                type: 'sale',
                                note: '門市銷售'
                            }));
                        });
                    });

                    const inItem = CATALOG[(storeIndex + monthOffset) % CATALOG.length];
                    const inboundQty = 12 + ((monthOffset + storeIndex) % 5) * 4;
                    const inDate = formatDate(new Date(monthDate.getFullYear(), monthDate.getMonth(), Math.min(6, daysInMonth)));

                    logs.push(buildLogRecord({
                        id: nextId++,
                        date: inDate,
                        time: '09:30',
                        store: store.id,
                        item: inItem,
                        qty: inboundQty,
                        type: 'shipment_in',
                        note: '總部配送點收',
                        expiryDate: formatDate(new Date(monthDate.getFullYear(), monthDate.getMonth(), Math.min(13, daysInMonth)))
                    }));
                });
            });

            return logs.sort(compareDateTimeDesc);
        };

        const YearMonthPicker = ({ value, options, onChange, yearLabel = '年份', monthLabel = '月份' }) => {
            const years = [...new Set(options.map((option) => option.year))];
            const [year, month] = value.split('-');
            const months = options.filter((option) => option.year === year);

            return (
                <div className="flex flex-col sm:flex-row gap-2">
                    <label className="flex flex-col gap-1 text-xs font-bold text-stone-500">
                        {yearLabel}
                        <select
                            value={year}
                            onChange={(event) => {
                                const nextYear = event.target.value;
                                const nextMonth = options.find((option) => option.year === nextYear)?.month || '01';
                                onChange(`${nextYear}-${nextMonth}`);
                            }}
                            className="border border-stone-300 rounded-lg px-3 py-2 bg-white font-medium text-stone-700 min-w-[110px]"
                        >
                            {years.map((optionYear) => (
                                <option key={optionYear} value={optionYear}>{optionYear} 年</option>
                            ))}
                        </select>
                    </label>
                    <label className="flex flex-col gap-1 text-xs font-bold text-stone-500">
                        {monthLabel}
                        <select
                            value={month}
                            onChange={(event) => onChange(`${year}-${event.target.value}`)}
                            className="border border-stone-300 rounded-lg px-3 py-2 bg-white font-medium text-stone-700 min-w-[96px]"
                        >
                            {months.map((option) => (
                                <option key={option.key} value={option.month}>{Number(option.month)} 月</option>
                            ))}
                        </select>
                    </label>
                </div>
            );
        };

        const TrendLineChart = ({ data }) => {
            if (!data.length) return null;

            const width = 820;
            const height = 250;
            const padX = 45;
            const padY = 35;
            const maxValue = Math.max(...data.map((point) => point.value), 10);

            const points = data.map((point, index) => {
                const x = padX + (index * (width - padX * 2) / Math.max(data.length - 1, 1));
                const y = height - padY - ((point.value / maxValue) * (height - padY * 2));
                return { ...point, x, y };
            });

            return (
                <div className="w-full h-full min-h-[240px]">
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-full overflow-visible">
                        <defs>
                            <linearGradient id="trendArea" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#dc2626" stopOpacity="0.35" />
                                <stop offset="100%" stopColor="#dc2626" stopOpacity="0" />
                            </linearGradient>
                        </defs>
                        <line x1={padX} y1={height - padY} x2={width - padX} y2={height - padY} stroke="#d6d3d1" strokeWidth="2" strokeDasharray="5 5" />
                        <polygon
                            fill="url(#trendArea)"
                            points={`${padX},${height - padY} ${points.map((point) => `${point.x},${point.y}`).join(' ')} ${width - padX},${height - padY}`}
                        />
                        <polyline
                            points={points.map((point) => `${point.x},${point.y}`).join(' ')}
                            fill="none"
                            stroke="#dc2626"
                            strokeWidth="4"
                            strokeLinecap="round"
                            strokeLinejoin="round"
                        />
                        {points.map((point) => (
                            <g key={point.label}>
                                <circle cx={point.x} cy={point.y} r="5" fill="#ffffff" stroke="#dc2626" strokeWidth="3" />
                                <text x={point.x} y={height - 12} textAnchor="middle" fill="#78716c" fontSize="13" fontWeight="700">{point.label}</text>
                                <text x={point.x} y={point.y - 14} textAnchor="middle" fill="#1c1917" fontSize="14" fontWeight="800">{point.value}</text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [currentRole, setCurrentRole] = useState('hq');
            const [inventory, setInventory] = useState(createInventorySeed());
            const [logs, setLogs] = useState(generateHistoricalLogs());
            const [shipments, setShipments] = useState([
                {
                    id: 'SHP-202604-001',
                    date: formatDate(),
                    targetStore: 'store-kh',
                    itemId: 'P002',
                    item: '甜不辣',
                    qty: 40,
                    mfgDate: formatDate(),
                    expDate: addDays(9),
                    status: 'shipped'
                },
                {
                    id: 'SHP-202604-002',
                    date: addDays(-3),
                    targetStore: 'store-hc',
                    itemId: 'P005',
                    item: '鴨翅',
                    qty: 28,
                    mfgDate: addDays(-3),
                    expDate: addDays(12),
                    status: 'received'
                }
            ]);
            const [toastMessage, setToastMessage] = useState('');
            const [labelModal, setLabelModal] = useState(null);
            const [dashboardMonthKey, setDashboardMonthKey] = useState(toYearMonth(formatDate()));
            const [dashboardDate, setDashboardDate] = useState(formatDate().replaceAll('/', '-'));
            const [dashboardStoreFilter, setDashboardStoreFilter] = useState('all');
            const [logsMonthKey, setLogsMonthKey] = useState(toYearMonth(formatDate()));
            const [logsStoreFilter, setLogsStoreFilter] = useState('all');
            const [logsQtyFilter, setLogsQtyFilter] = useState('all');
            const [itemAnalysisStoreFilter, setItemAnalysisStoreFilter] = useState('all');

            const isHQ = currentRole === 'hq';
            const currentMonthKey = toYearMonth(formatDate());

            const showToast = (message) => {
                setToastMessage(message);
                window.clearTimeout(window.__erpToastTimer);
                window.__erpToastTimer = window.setTimeout(() => setToastMessage(''), 2800);
            };

            const getStoreName = (storeId) => STORES.find((store) => store.id === storeId)?.name || '未指定';
            const getStoreAddress = (storeId) => STORES.find((store) => store.id === storeId)?.address || '';
            const getItemById = (itemId) => inventory.find((item) => item.id === itemId) || CATALOG.find((item) => item.id === itemId);

            const getStockForStore = (item, storeId) => {
                if (storeId === 'all') return item.batches.reduce((total, batch) => total + batch.qty, 0);
                return item.batches.filter((batch) => batch.store === storeId).reduce((total, batch) => total + batch.qty, 0);
            };

            const getVisibleStock = (item) => getStockForStore(item, isHQ ? 'all' : currentRole);

            const getBatchesForStore = (item, storeId) => (
                storeId === 'all'
                    ? item.batches.filter((batch) => batch.qty > 0)
                    : item.batches.filter((batch) => batch.store === storeId && batch.qty > 0)
            );

            const getEarliestExpiryDate = (item, storeId) => {
                const targetBatches = getBatchesForStore(item, storeId);
                if (!targetBatches.length) return '-';
                const earliest = targetBatches.reduce((current, batch) => parseDateString(batch.exp) < parseDateString(current.exp) ? batch : current, targetBatches[0]);
                return earliest.exp;
            };

            const getExpiryStatus = (item, storeId) => {
                const targetBatches = getBatchesForStore(item, storeId);

                if (!targetBatches.length) {
                    return { level: 'safe', label: '無存貨', color: 'text-stone-500 bg-stone-100 border border-stone-200' };
                }

                const earliest = targetBatches.reduce((current, batch) => parseDateString(batch.exp) < parseDateString(current.exp) ? batch : current, targetBatches[0]);
                const today = new Date();
                const warningDate = new Date();
                warningDate.setDate(warningDate.getDate() + 2);
                const earliestDate = parseDateString(earliest.exp);

                if (earliestDate < today) {
                    return { level: 'expired', label: `已過期 ${earliest.exp}`, color: 'text-red-700 bg-red-100 border border-red-200' };
                }

                if (earliestDate <= warningDate) {
                    return { level: 'warning', label: `即將到期 ${earliest.exp}`, color: 'text-orange-700 bg-orange-100 border border-orange-200' };
                }

                return { level: 'safe', label: `效期正常 ${earliest.exp}`, color: 'text-green-700 bg-green-100 border border-green-200' };
            };

            const changeInventoryQty = (items, itemId, storeId, delta, options = {}) => items.map((item) => {
                if (item.id !== itemId) return item;

                if (delta > 0) {
                    const nextBatch = createBatch({
                        store: storeId,
                        qty: delta,
                        exp: options.expDate || addDays(7),
                        receivedDate: options.receivedDate || formatDate(),
                        source: options.source || '進貨入庫'
                    });
                    return { ...item, batches: [...item.batches, nextBatch] };
                }

                if (delta < 0) {
                    let remaining = Math.abs(delta);
                    const batches = [...item.batches]
                        .sort((a, b) => {
                            if (a.store !== b.store) return 0;
                            return parseDateString(a.exp) - parseDateString(b.exp);
                        })
                        .map((batch) => {
                            if (batch.store !== storeId || remaining === 0) return batch;
                            const deduct = Math.min(batch.qty, remaining);
                            remaining -= deduct;
                            return { ...batch, qty: batch.qty - deduct };
                        })
                        .filter((batch) => batch.qty > 0);
                    return { ...item, batches };
                }

                return item;
            });

            const appendLog = (entry) => {
                setLogs((previous) => [entry, ...previous].sort(compareDateTimeDesc));
            };

            const createLiveLog = ({ itemId, qty, store, type, note = '', counterpartyStore = '', expiryDate = '' }) => {

                const foodSafetyAlerts = visibleItems.filter((item) => {

                return { salesQty, revenue, profit, lowStockCount, foodSafetyAlerts };

                const trendData = useMemo(() => {

                        grouped[log.store] = { storeId: log.store, revenue: 0, qty: 0 };
                    }
                    grouped[log.store].revenue += log.salesAmount;
                    grouped[log.store].qty += log.qty;

                return Object.values(grouped)
                    .sort((a, b) => b.revenue - a.revenue)
                    .slice(0, 3);

            const itemAnalysisRows = useMemo(() => {

                    }

                            </div>
                        </div>

            const POSView = () => {
                const [cart, setCart] = useState([]);
                const [targetStore, setTargetStore] = useState(currentRole);

                useEffect(() => {
                    setTargetStore(currentRole);
                }, [currentRole]);

                const addToCart = (item) => {
                    if (getStockForStore(item, targetStore) <= 0) return;
                    setCart((previous) => {
                        const existing = previous.find((entry) => entry.id === item.id);
                        if (existing) return previous.map((entry) => entry.id === item.id ? { ...entry, qty: entry.qty + 1 } : entry);
                        return [...previous, { ...item, qty: 1 }];
                    });
                };

                const updateQty = (itemId, delta) => {
                    setCart((previous) => previous.map((entry) => entry.id === itemId ? { ...entry, qty: Math.max(0, entry.qty + delta) } : entry).filter((entry) => entry.qty > 0));
                };

                const totalAmount = cart.reduce((total, item) => total + (item.price * item.qty), 0);

                const handleCheckout = () => {
                    if (!cart.length) return;
                    for (const cartItem of cart) {
                        const item = getItemById(cartItem.id);
                        if (cartItem.qty > getStockForStore(item, targetStore)) return showToast(`${cartItem.name} 庫存不足，請重新確認。`);
                    }

                    setInventory((previous) => {
                        let nextInventory = previous;
                        cart.forEach((cartItem) => {
                            nextInventory = changeInventoryQty(nextInventory, cartItem.id, targetStore, -cartItem.qty);
                        });
                        return nextInventory;
                    });

                    cart.forEach((cartItem) => appendLog(createLiveLog({ itemId: cartItem.id, qty: cartItem.qty, store: targetStore, type: 'sale', note: 'POS 結帳' })));
                    setCart([]);
                    showToast(`已完成結帳，金額 ${formatCurrency(totalAmount)}。`);

                                        <button key={item.id} onClick={() => addToCart(item)} disabled={soldOut} className={`rounded-2xl border p-4 text-left transition ${soldOut ? 'bg-stone-100 border-stone-200 opacity-60 cursor-not-allowed' : 'bg-white border-stone-200 hover:border-red-400 hover:shadow-md'}`}>

                                                </div>
                                            </div>
                                        ))}

                            <div>
                                <h1 className="font-black tracking-wide leading-tight">二鍋頭東山鴨頭</h1>
                                <p className="text-xs text-stone-400 mt-1">ERP 系統 | TKY Design 製</p>
                            </div>
                        </div>
                        <nav className="flex-1 py-4 overflow-y-auto custom-scrollbar">
                            {sidebarItems.map((item) => {
                                if (item.reqHQ && !isHQ) return null;
                                if (item.reqStore && isHQ) return null;
                                return <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-4 px-6 py-4 transition ${activeTab === item.id ? 'bg-stone-800 border-l-4 border-red-600 text-white' : 'text-stone-400 hover:bg-stone-800/70'}`}>{item.icon}<span className="font-medium">{item.label}</span></button>;
                            })}
                        </nav>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden">
                        <header className="bg-white border-b border-stone-200 px-4 md:px-6 py-4 shadow-sm flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3 md:hidden">
                                <div className="bg-red-700 p-2 rounded-xl text-white"><FireIcon /></div>
                                <div>
                                    <div className="font-black text-sm leading-tight">二鍋頭東山鴨頭</div>
                                    <div className="text-[11px] text-stone-500 mt-0.5">ERP 系統 | TKY Design 製</div>
                                </div>
                            </div>
                            <h2 className="hidden md:block text-2xl font-black text-stone-900">{activeTitle}</h2>
                            <div className="flex items-center gap-2 bg-stone-100 border border-stone-200 rounded-full px-3 py-2">
                                <UserIcon />
                                <select value={currentRole} onChange={(event) => { setCurrentRole(event.target.value); if ((activeTab === 'shipping' || activeTab === 'pos') && event.target.value === 'hq') setActiveTab('dashboard'); if (activeTab === 'shipping' && event.target.value !== 'hq') setActiveTab('dashboard'); }} className="bg-transparent outline-none font-bold text-sm text-stone-800">
                                    {STORES.map((store) => <option key={store.id} value={store.id}>{store.name}</option>)}
                                </select>
                            </div>
                        </header>

                        <div className="flex-1 overflow-y-auto custom-scrollbar p-3 md:p-6 bg-stone-100/70">
                            <div className="max-w-7xl mx-auto">
                                {activeTab === 'dashboard' && <DashboardView />}
                                {activeTab === 'inventory' && <InventoryView />}
                                {activeTab === 'shipping' && isHQ && <ShippingView />}
                                {activeTab === 'scanner' && <ScannerView />}
                                {activeTab === 'pos' && currentRole !== 'hq' && <POSView />}
                                {activeTab === 'logs' && <MovementLogsView />}
                            </div>
                        </div>
                    </main>

                    <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-stone-900 shadow-[0_-6px_24px_rgba(0,0,0,0.18)] z-50 flex justify-around p-2 pb-safe">
                        {mobileItems.map((item) => (
                            <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex flex-col items-center gap-1 p-2 ${activeTab === item.id ? 'text-red-500' : 'text-stone-400'}`}>
                                {item.icon}
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </button>
                        ))}
                    </nav>

                    {labelModal && (
                        <div className="fixed inset-0 z-[100] bg-stone-900/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="w-full max-w-md bg-white rounded-2xl overflow-hidden shadow-2xl">
                                <div className="px-6 py-4 border-b border-stone-200 bg-stone-50 flex items-center justify-between">
                                    <h3 className="font-black text-stone-900 flex items-center gap-2"><QrCodeIcon />配送標籤預覽</h3>
                                    <button onClick={() => setLabelModal(null)} className="text-2xl text-stone-400 hover:text-stone-700">&times;</button>
                                </div>
                                <div className="p-6 bg-stone-200 flex justify-center">
                                    <div className="w-72 bg-white border-2 border-stone-300 shadow-md p-5 rounded-xl">
                                        <div className="flex justify-between items-start gap-4">
                                            <div>
                                                <p className="text-xs font-semibold text-stone-500">品項名稱</p>
                                                <p className="text-xl font-black text-red-700 mt-1">{labelModal.item}</p>
                                                <p className="text-xs font-semibold text-stone-500 mt-4">配送數量</p>
                                                <p className="text-2xl font-black text-stone-900 mt-1">{labelModal.qty}</p>
                                            </div>
                                            <MockQRCode />
                                        </div>
                                        <div className="mt-5 space-y-2 text-sm">
                                            <div className="flex justify-between gap-4"><span className="text-stone-500">單號</span><span className="font-bold text-stone-900">{labelModal.id}</span></div>
                                            <div className="flex justify-between gap-4"><span className="text-stone-500">目的門市</span><span className="font-bold text-stone-900 text-right">{getStoreName(labelModal.targetStore)}</span></div>
                                            <div className="flex justify-between gap-4"><span className="text-stone-500">製造日</span><span className="font-bold text-stone-900">{labelModal.mfgDate}</span></div>
                                            <div className="flex justify-between gap-4"><span className="text-stone-500">有效日</span><span className="font-bold text-red-700">{labelModal.expDate}</span></div>
                                            <div className="pt-2 text-xs text-stone-500 leading-relaxed">{getStoreAddress(labelModal.targetStore)}</div>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-4 border-t border-stone-200 bg-white flex gap-3">
                                    <button onClick={() => exportShipmentLabel(labelModal)} className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition">下載 Excel 標籤</button>
                                    <button onClick={() => { setLabelModal(null); showToast('已送出標籤列印。'); }} className="flex-1 bg-stone-900 hover:bg-stone-800 text-white font-bold py-3 rounded-xl transition">模擬列印</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toastMessage && <div className="fixed top-4 right-4 z-[110] bg-stone-900 text-white px-4 py-3 rounded-xl shadow-2xl font-medium">{toastMessage}</div>}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
